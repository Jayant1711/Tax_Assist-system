[pytest]
testpaths = tests
markers =
    slow: long-running property grids (deselect with -m "not slow")
    eval: ADVISORY Sprint-4 extraction gate (>=95% income heads + major
        sections, tests/test_nlp_eval.py::TestExtractionGateAdvisory).
        Excluded from the default run this wave — the gate REPORTS but
        does not bind until P1's verdict (docs/sprint4-execution.md P0
